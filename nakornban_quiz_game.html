<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบกฎหมาย กรมพระนครบาล (Pixel Art)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1614;
            font-family: 'Sarabun', sans-serif;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            max-height: 850px;
            background: linear-gradient(180deg, #2b1f1d 0%, #171110 100%);
            border: 4px solid #8b5a2b;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(212,175,55,0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .header {
            background: #4a1512;
            border-bottom: 3px solid #8b5a2b;
            padding: 10px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #f3e5ab;
            text-shadow: 2px 2px 0px #000;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 15px;
            background: rgba(0,0,0,0.4);
            font-size: 14px;
            color: #e6c687;
        }

        .stage-view {
            flex: 1;
            position: relative;
            background: #231917;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pixel-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .content-area {
            background: #36251e;
            border-top: 3px solid #8b5a2b;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 320px;
        }

        .question-box {
            background: #241713;
            border: 2px solid #5c3a21;
            padding: 12px;
            border-radius: 4px;
            color: #fff;
            font-size: 15px;
            line-height: 1.4;
            min-height: 70px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .btn-option {
            background: linear-gradient(180deg, #5a3d28 0%, #3a2517 100%);
            border: 2px solid #8b6b47;
            color: #f3e5ab;
            padding: 10px 12px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            font-family: 'Sarabun', sans-serif;
        }

        .btn-option:hover {
            background: linear-gradient(180deg, #7a5438 0%, #4a301d 100%);
            border-color: #d4af37;
        }

        .btn-option.correct {
            background: #2e5a1c !important;
            border-color: #55ff55 !important;
            color: #fff !important;
        }

        .btn-option.wrong {
            background: #6a1b1b !important;
            border-color: #ff4444 !important;
            color: #fff !important;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(23, 17, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .btn-start {
            background: linear-gradient(180deg, #a83232 0%, #6b1d1d 100%);
            border: 3px solid #f3e5ab;
            color: #fff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 0 #3a0d0d;
            margin-top: 15px;
            font-family: 'Sarabun', sans-serif;
        }

        .feedback-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            border: 2px solid #fff;
            z-index: 5;
            pointer-events: none;
        }

        .feedback-correct { background: #2e5a1c; color: #aaffaa; border-color: #aaffaa; }
        .feedback-wrong { background: #6a1b1b; color: #ffaaaa; border-color: #ffaaaa; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h1>⚖️ กรมพระนครบาล : แบบทดสอบกฎหมาย ⚖️</h1>
    </div>

    <div class="status-bar">
        <span id="progress-text">ข้อที่: 1/10</span>
        <span id="score-text">คะแนน: 0</span>
    </div>

    <div class="stage-view">
        <svg id="pixel-canvas" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <style>.pixel { shape-rendering: crispEdges; }</style>
            </defs>
            <rect class="pixel" x="0" y="0" width="160" height="90" fill="#2d1e29"/>
            <polygon class="pixel" points="10,90 20,40 30,90" fill="#4a3545"/>
            <polygon class="pixel" points="25,90 40,25 55,90" fill="#5c4256"/>
            <polygon class="pixel" points="70,90 90,15 110,90" fill="#6e4f69"/>
            <polygon class="pixel" points="125,90 140,35 155,90" fill="#4a3545"/>

            <rect class="pixel" x="0" y="90" width="160" height="8" fill="#8b5a2b"/>
            <rect class="pixel" x="0" y="98" width="160" height="42" fill="#1c120c"/>

            <g id="character-group">
                <g id="char-normal">
                    <path class="pixel" d="M74,55 L86,55 L83,45 L77,45 Z" fill="#b8860b"/>
                    <rect class="pixel" x="72" y="55" width="16" height="3" fill="#8b0000"/>
                    <rect class="pixel" x="75" y="58" width="10" height="8" fill="#ffdbac"/>
                    <rect class="pixel" x="77" y="61" width="2" height="2" fill="#000"/>
                    <rect class="pixel" x="81" y="61" width="2" height="2" fill="#000"/>
                    <rect class="pixel" x="73" y="66" width="14" height="16" fill="#4a2c11"/>
                    <rect class="pixel" x="78" y="66" width="4" height="16" fill="#8b0000"/>
                    <rect class="pixel" x="72" y="76" width="16" height="3" fill="#d4af37"/>
                    <rect class="pixel" x="68" y="74" width="4" height="12" fill="#c0c0c0"/>
                    <rect class="pixel" x="74" y="82" width="4" height="8" fill="#2b1d0c"/>
                    <rect class="pixel" x="82" y="82" width="4" height="8" fill="#2b1d0c"/>
                </g>

                <g id="char-happy" class="hidden">
                    <g id="happy-jump">
                        <path class="pixel" d="M74,50 L86,50 L83,40 L77,40 Z" fill="#b8860b"/>
                        <rect class="pixel" x="72" y="50" width="16" height="3" fill="#8b0000"/>
                        <rect class="pixel" x="75" y="53" width="10" height="8" fill="#ffdbac"/>
                        <path class="pixel" d="M77,55 L79,55 M81,55 L83,55" stroke="#000" stroke-width="1"/>
                        <rect class="pixel" x="78" y="58" width="4" height="2" fill="#ff6666"/>
                        <rect class="pixel" x="73" y="61" width="14" height="16" fill="#4a2c11"/>
                        <rect class="pixel" x="68" y="58" width="4" height="10" fill="#4a2c11"/>
                        <rect class="pixel" x="88" y="58" width="4" height="10" fill="#4a2c11"/>
                        <rect class="pixel" x="73" y="77" width="4" height="6" fill="#2b1d0c"/>
                        <rect class="pixel" x="83" y="77" width="4" height="6" fill="#2b1d0c"/>
                    </g>
                    <g id="confetti">
                        <rect class="pixel" x="40" y="30" width="3" height="3" fill="#ff0"/>
                        <rect class="pixel" x="120" y="25" width="4" height="4" fill="#ff0055"/>
                        <rect class="pixel" x="50" y="50" width="3" height="3" fill="#00ffcc"/>
                        <rect class="pixel" x="110" y="45" width="3" height="3" fill="#ff9900"/>
                    </g>
                </g>

                <g id="char-angry" class="hidden">
                    <rect class="pixel" x="65" y="45" width="30" height="45" fill="rgba(255,0,0,0.2)"/>
                    <path class="pixel" d="M74,55 L86,55 L83,45 L77,45 Z" fill="#8b0000"/>
                    <rect class="pixel" x="75" y="58" width="10" height="8" fill="#ff8888"/>
                    <line x1="76" y1="60" x2="79" y2="63" stroke="#000" stroke-width="1"/>
                    <line x1="84" y1="60" x2="81" y2="63" stroke="#000" stroke-width="1"/>
                    <rect class="pixel" x="73" y="66" width="14" height="16" fill="#4a2c11"/>
                    <path class="pixel" d="M40,40 L100,85" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
                    <path class="pixel" d="M45,38 L105,83" stroke="#ff3333" stroke-width="2"/>
                    <line x1="85" y1="70" x2="115" y2="50" stroke="#c0c0c0" stroke-width="3"/>
                </g>
            </g>
        </svg>

        <div id="feedback-banner" class="feedback-banner hidden"></div>
    </div>

    <div class="content-area">
        <div id="question-box" class="question-box">กำลังโหลดคำถาม...</div>
        <div id="options-grid" class="options-grid"></div>
    </div>

    <div id="start-screen" class="screen">
        <h2 style="color: #f3e5ab; margin-bottom: 5px;">📜 กฎหมายพระนครบาล 📜</h2>
        <p style="color: #ccc; font-size: 14px; line-height: 1.5; margin-bottom: 15px;">
            ยินดีต้อนรับสู่อโยธยา!<br>
            แบบทดสอบกฎหมายและระเบียบพระนคร 10 ข้อ<br>
            (เกณฑ์ผ่าน: 7 ข้อขึ้นไป)
        </p>
        <button id="start-btn" class="btn-start">⚔️ คลิกเพื่อเริ่ม (CLICK TO START) ⚔️</button>
    </div>

    <div id="result-screen" class="screen hidden">
        <h2 id="result-title" style="color: #f3e5ab; margin-bottom: 10px;">สรุปผลการทดสอบ</h2>
        <div id="result-score" style="font-size: 28px; font-weight: bold; color: #ffeb3b; margin: 10px 0;">0 / 10</div>
        <p id="result-desc" style="color: #fff; font-size: 15px; margin-bottom: 20px; line-height: 1.4;"></p>
        <button id="restart-btn" class="btn-start">🔄 เล่นใหม่อีกครั้ง</button>
    </div>
</div>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08); osc.frequency.setValueAtTime(783.99, now + 0.16);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(110, now + 0.1); gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'slash') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.25); gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25); osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'cheer') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3); gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
    }

    const rawQuestions = [
        {
            q: "การแต่งกายไม่ถูกต้องตามยุคและระเบียบ หากไม่ยอมเปลี่ยน สามารถจับกุมได้กี่วินาที?",
            options: ["60 วินาที", "120 วินาที", "300 วินาที", "600 วินาที"],
            answer: 1,
            reason: "ให้ตักเตือนก่อน หากไม่ยอมเปลี่ยน จับกุมได้ 120 วินาที"
        },
        {
            q: "การยิงปืนในพระนครโดยไม่มีผู้เสียชีวิต ให้จับกุมกี่วินาที?",
            options: ["120 วินาที", "300 วินาที", "600 วินาที", "1200 วินาที"],
            answer: 2,
            reason: "ยิงปืนในพระนครไม่มีผู้เสียชีวิต จับกุม 600 วินาที (ทำผิดซ้ำซากเพิ่มเป็น 900 วิ)"
        },
        {
            q: "การฆ่ากันจนถึงแก่ความตาย ให้จับกุมเป็นเวลากี่วินาที?",
            options: ["600 วินาที", "900 วินาที", "1200 - 1800 วินาที", "2400 วินาที"],
            answer: 2,
            reason: "ฆ่ากันถึงแก่ความตาย ให้จับกุม 1200-1800 วินาที โดยไม่ต้องตักเตือน"
        },
        {
            q: "การจับกุมมากหรือน้อยกว่าที่กำหนดไว้ในกฎหมายถือเป็นอย่างไร?",
            options: ["ถือเป็นความชอบธรรม", "ถือเป็นความผิด", "ทำได้หากผู้ร้ายขัดขืน", "ได้รับการละเว้น"],
            answer: 1,
            reason: "การจับกุมมากหรือน้อยกว่าที่กำหนดถือเป็นความผิด"
        },
        {
            q: "กรณีขุนนางกระทำความผิด โทษสูงสุดหรือการดำเนินการคือข้อใด?",
            options: ["จำคุก 1000 วิ", "ริบทรัพย์", "ประหารชีวิต", "ปลดจ่า / ลงบรรดาศักดิ์ / จำคุก / ปรับ"],
            answer: 3,
            reason: "กำหนดโทษสำหรับขุนนางคือ ปลดจ่า / ลงบรรดาศักดิ์ / จำคุก / ปรับ"
        },
        {
            q: "การทำผิดฐานฆ่าผู้อื่น มีโทษอย่างไร?",
            options: ["จำคุก 600 วิ", "จำคุก 1050 วิ / ปรับ 5000 พดด้วง", "จำคุก 1500 วิ", "ประหารชีวิต"],
            answer: 1,
            reason: "กำหนดโทษฆ่าผู้อื่น: จำคุก 1050 วิ / ปรับ 5000 พดด้วง"
        },
        {
            q: "การขโมยม้าลำปางรอง มีโทษจำคุกกี่วินาที?",
            options: ["300 วิ", "500 วิ", "750 วิ", "1800 วิ"],
            answer: 1,
            reason: "ขโมยม้าลำปางรอง มีโทษจำคุก 500 วิ"
        },
        {
            q: "การกระทำตั้งแต่ 5 คนขึ้นไปร่วมกระทำความผิด เรียกว่าอะไร?",
            options: ["ซ่องโจร", "ขบถพระนคร", "วางเพลิง", "ก่อสุมรุมสเกล"],
            answer: 0,
            reason: "การร่วมกระทำผิดตั้งแต่ 5 คนขึ้นไป เรียกว่า 'ซ่องโจร' (จำคุก 1200 วิ)"
        },
        {
            q: "การป้องกันตัวเกินกว่าเหตุ มีโทษอย่างไร?",
            options: ["จำคุก 120 วิ", "จำคุก 350 วิ", "จำคุก 500 วิ", "จำคุก 750 วิ"],
            answer: 1,
            reason: "ป้องกันตัวเกินกว่าเหตุ มีโทษจำคุก 350 วิ"
        },
        {
            q: "ขุนนางกระทำความผิด มีโทษอย่างไรเทียบกับคนทั่วไป?",
            options: ["โทษเท่ากัน", "รับโทษ 2 เท่า", "ลดโทษกึ่งหนึ่ง", "ไม่ต้องรับโทษ"],
            answer: 1,
            reason: "ขุนนางกระทำความผิด รับโทษเป็น 2 เท่า"
        }
    ];

    let questions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    const startScreen = document.getElementById('start-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const questionBox = document.getElementById('question-box');
    const optionsGrid = document.getElementById('options-grid');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const feedbackBanner = document.getElementById('feedback-banner');

    const charNormal = document.getElementById('char-normal');
    const charHappy = document.getElementById('char-happy');
    const charAngry = document.getElementById('char-angry');

    function handleStart() {
        initAudio();
        playSound('click');
        startGame();
    }

    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(); });
    restartBtn.addEventListener('click', handleStart);
    restartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(); });

    function startGame() {
        questions = shuffleArray(rawQuestions);
        currentQuestionIndex = 0;
        score = 0;

        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        
        resetCharState();
        updateHeader();
        loadQuestion();
    }

    function resetCharState() {
        charNormal.classList.remove('hidden');
        charHappy.classList.add('hidden');
        charAngry.classList.add('hidden');
    }

    function updateHeader() {
        progressText.innerText = `ข้อที่: ${currentQuestionIndex + 1}/${questions.length}`;
        scoreText.innerText = `คะแนน: ${score}`;
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        questionBox.innerText = q.q;
        optionsGrid.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.onclick = () => selectOption(idx);
            optionsGrid.appendChild(btn);
        });

        updateHeader();
    }

    function selectOption(selectedIndex) {
        const q = questions[currentQuestionIndex];
        const buttons = optionsGrid.children;

        for (let btn of buttons) {
            btn.style.pointerEvents = 'none';
        }

        if (selectedIndex === q.answer) {
            score++;
            buttons[selectedIndex].classList.add('correct');
            playSound('correct');
            showFeedback(true, "ถูกต้อง! " + q.reason);
        } else {
            buttons[selectedIndex].classList.add('wrong');
            buttons[q.answer].classList.add('correct');
            playSound('wrong');
            showFeedback(false, "ผิด! " + q.reason);
        }

        scoreText.innerText = `คะแนน: ${score}`;

        setTimeout(() => {
            hideFeedback();
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 2200);
    }

    function showFeedback(isCorrect, text) {
        feedbackBanner.innerText = isCorrect ? "✨ ถูกต้อง!" : "❌ ผิด!";
        feedbackBanner.className = `feedback-banner ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}`;
        feedbackBanner.classList.remove('hidden');
        questionBox.innerText = text;
    }

    function hideFeedback() {
        feedbackBanner.classList.add('hidden');
    }

    function endGame() {
        const passed = score >= 7;

        charNormal.classList.add('hidden');
        
        if (passed) {
            charHappy.classList.remove('hidden');
            playSound('cheer');
            document.getElementById('result-title').innerText = "🎉 ผ่านการทดสอบ! 🎉";
            document.getElementById('result-title').style.color = "#55ff55";
            document.getElementById('result-desc').innerText = "ยินดีด้วย! ท่านมีความเชี่ยวชาญกฎหมายพระนครบาล เหมาะสมแก่การรับราชการรักษาความสงบ!";
        } else {
            charAngry.classList.remove('hidden');
            playSound('slash');
            document.getElementById('result-title').innerText = "⚔️ ไม่ผ่านการทดสอบ! ⚔️";
            document.getElementById('result-title').style.color = "#ff4444";
            document.getElementById('result-desc').innerText = "ความรู้กฎหมายยังไม่เพียงพอ! กรมพระนครบาลลงโทษประหาร/ฟันดาบ ไปทบทวนกฎหมายมาใหม่!";
        }

        document.getElementById('result-score').innerText = `${score} / ${questions.length} คะแนน`;
        resultScreen.classList.remove('hidden');
    }
</script>

</body>
</html>
