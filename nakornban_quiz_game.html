<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบกฎหมาย กรมพระนครบาล</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap');

        :root {
            --navy: #12345a;
            --blue: #1769aa;
            --blue-2: #2d8bd0;
            --sky: #dff2ff;
            --ice: #f3f9ff;
            --ink: #18324d;
            --muted: #607b96;
            --line: #c8e2f5;
            --gold: #d9ad52;
            --green: #16845b;
            --red: #c74652;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 18px;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(145deg, #eaf6ff 0%, #d8ebfa 48%, #c8e0f3 100%);
            color: var(--ink);
            font-family: 'Sarabun', sans-serif;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 920px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }
        #game-container {
            width: 100%;
            max-width: 520px;
            min-height: 860px;
            background: #fff;
            border: 1px solid rgba(35,112,171,.2);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(18,52,90,.2);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
        }
        .rank-sidebar {
            width: 320px;
            background: #fff;
            border: 1px solid rgba(35,112,171,.2);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(18,52,90,.15);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .rank-sidebar h3 {
            margin: 0 0 5px 0;
            color: var(--navy);
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 8px;
        }
        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 750px;
            overflow-y: auto;
        }
        .rank-item {
            background: var(--ice);
            border: 1px solid #c8e2f5;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .rank-item.top-1 { background: #fffbe6; border-color: #ffe58f; }
        .rank-row-top {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--navy);
        }
        .rank-row-sub {
            font-size: 12px;
            color: var(--muted);
        }

        .header {
            padding: 19px 16px 15px;
            text-align: center; color: white;
            background: linear-gradient(135deg, #12345a 0%, #1769aa 58%, #318dca 100%);
            border-bottom: 4px solid var(--gold);
        }
        .header h1 { margin: 0; font-size: 22px; font-weight: 800; }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 18px; color: var(--navy); background: #f2f8fd;
            border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 700;
        }
        .stage-view {
            flex: 1; min-height: 180px; max-height: 220px;
            position: relative; display: flex; justify-content: center; align-items: center;
            overflow: hidden; background: linear-gradient(180deg, #d8efff 0%, #c6e3f7 100%);
        }
        #pixel-canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        .content-area {
            background: #fff; border-top: 1px solid var(--line);
            padding: 16px; display: flex; flex-direction: column; gap: 12px;
            min-height: 290px;
        }
        .question-box {
            background: var(--ice); border: 1px solid #c4e1f5;
            border-left: 5px solid var(--blue-2); padding: 13px;
            border-radius: 11px; color: var(--ink); font-size: 14px; font-weight: 600;
            line-height: 1.4;
        }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .btn-option {
            background: #fff; border: 1.5px solid #c7dfef; color: #24445f;
            padding: 11px 13px; font-size: 13px; font-weight: 600; text-align: left;
            cursor: pointer; border-radius: 10px; font-family: 'Sarabun', sans-serif;
            transition: all 0.15s ease;
        }
        .btn-option:hover { background: #eaf6ff; border-color: #58a6dc; }
        .btn-option.correct { background: #e5f7ef !important; border-color: #48ae82 !important; color: #126342 !important; }
        .btn-option.wrong { background: #fff0f1 !important; border-color: #df7780 !important; color: #a52e3a !important; }
        .screen {
            position: absolute; inset: 0; background: rgba(235,246,255,.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 25px; text-align: center; z-index: 10;
        }
        .hidden { display: none !important; }
        .input-group { width: 100%; max-width: 300px; margin-bottom: 10px; text-align: left; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
        .input-control {
            width: 100%; padding: 9px 12px; border: 1.5px solid #c8e2f5;
            border-radius: 10px; font-size: 14px; font-family: 'Sarabun', sans-serif; outline: none;
        }
        .input-control:focus { border-color: #1769aa; box-shadow: 0 0 0 3px rgba(23,105,170,0.15); }
        .btn-start {
            background: linear-gradient(135deg, #1b70b2, #2c91cf); border: none;
            color: #fff; padding: 11px 26px; font-size: 15px; font-weight: 800;
            cursor: pointer; border-radius: 10px; font-family: 'Sarabun', sans-serif;
            box-shadow: 0 4px 12px rgba(27,112,178,.3);
        }
        .feedback-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 10px 22px; font-size: 17px; font-weight: 800;
            border-radius: 12px; border: 1px solid #fff; z-index: 5; pointer-events: none;
            box-shadow: 0 8px 24px rgba(18,52,90,.22);
        }
        .feedback-correct { background: #16845b; color: #fff; border-color: #a8e6ca; }
        .feedback-wrong { background: #c74652; color: #fff; border-color: #ffc4c8; }

        /* แอนิเมชันต่อสู้ขยับตัวละคร */
        @keyframes slashAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            30% { transform: translate(15px, -5px) rotate(15deg); }
            60% { transform: translate(-10px, 0) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        @keyframes enemyHit {
            0% { transform: translate(0, 0); opacity: 1; }
            50% { transform: translate(-15px, 0) scale(0.9); fill: #c74652; }
            100% { transform: translate(0, 0); opacity: 1; }
        }
        .anim-attack { animation: slashAnim 0.4s ease; }
        .anim-hit { animation: enemyHit 0.4s ease; }

        @media (max-width: 860px) {
            .main-layout { flex-direction: column; align-items: center; }
            .rank-sidebar { width: 100%; max-width: 520px; }
        }
    </style>
</head>
<body>

<div class="main-layout">
    <!-- ตัวเกมหลัก -->
    <div id="game-container">
        <div class="header">
            <h1>⚖️ กรมพระนครบาล ⚖️</h1>
            <div style="font-size: 12px; margin-top: 3px;">แบบทดสอบความรู้กฎหมาย & กฎเหล็กกุญแจมือ</div>
        </div>

        <div class="status-bar">
            <span id="player-info-display">ผู้เล่น: - (-)</span>
            <span id="progress-text">ข้อที่: 01/20</span>
            <span id="score-text">SCORE: 00</span>
        </div>

        <!-- ฉากต่อสู้ระหว่างทำข้อสอบ -->
        <div class="stage-view">
            <svg id="pixel-canvas" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="160" height="90" fill="#030712"/>
                <circle cx="135" cy="22" r="8" fill="#e0f2fe"/>
                <polygon points="10,90 22,35 35,90" fill="#1e293b"/>
                <polygon points="68,90 85,12 102,90" fill="#0f172a"/>
                <rect x="0" y="90" width="160" height="6" fill="#0284c7"/>
                <rect x="0" y="96" width="160" height="44" fill="#090d16"/>
                
                <!-- ตัวละครฝั่งผู้เล่น (ซ้าย) -->
                <g id="player-fighter" transform="translate(40, 35)">
                    <rect x="10" y="21" width="14" height="10" fill="#ffdbac"/>
                    <rect x="8" y="31" width="18" height="16" fill="#0f172a"/>
                    <rect x="13" y="31" width="8" height="16" fill="#1769aa"/>
                    <!-- ดาบประจำตัว -->
                    <path id="player-sword" d="M26,30 L45,15" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
                </g>

                <!-- ตัวละครฝั่งคู่ปรับ / ผู้กระทำผิด (ขวา) -->
                <g id="enemy-fighter" transform="translate(100, 35)">
                    <rect x="10" y="21" width="14" height="10" fill="#fca5a5"/>
                    <rect x="8" y="31" width="18" height="16" fill="#7f1d1d"/>
                    <path d="M5,32 L-10,25" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
                </g>
            </svg>
            <div id="feedback-banner" class="feedback-banner hidden"></div>
        </div>

        <div class="content-area">
            <div id="question-box" class="question-box">กรุณากรอกข้อมูลเพื่อเริ่มเกม</div>
            <div id="options-grid" class="options-grid"></div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h2 style="color: #1769aa; margin-top: 0;">📜 ลงทะเบียนเข้าทดสอบ 📜</h2>
            
            <div class="input-group">
                <label for="player-name">ชื่อ-นามสกุล / ชื่อเล่น:</label>
                <input type="text" id="player-name" class="input-control" placeholder="กรอกชื่อของคุณ">
            </div>
            
            <div class="input-group">
                <label for="player-rank">ตำแหน่ง / ยศ:</label>
                <input type="text" id="player-rank" class="input-control" placeholder="เช่น ผู้บัญชาการ, ผู้กอง, สารวัตร">
            </div>

            <button id="start-btn" class="btn-start">⚔️ เริ่มทำแบบทดสอบ ⚔️</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2 id="result-title" style="color: #1769aa; margin-bottom: 10px;">สรุปผลการทดสอบ</h2>
            <div id="result-score" style="font-size: 30px; font-weight: 800; color: #1769aa;">0 / 20</div>
            <p id="result-desc" style="font-size: 13px; margin-bottom: 15px;"></p>
            <div id="save-status" style="font-size: 12px; color: var(--muted); margin-bottom: 15px;">กำลังบันทึกข้อมูลไปยัง Google Sheets...</div>
            <button id="restart-btn" class="btn-start">🔄 เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <!-- หน้าต่างแสดง RANK -->
    <div class="rank-sidebar">
        <h3>🏆 ทำเนียบอันดับ (High Score)</h3>
        <div id="rank-list" class="rank-list">
            <div class="rank-item">กำลังโหลดข้อมูลอันดับ...</div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbySaonCXGdrrfhOdoqktlY2Erul_kkeu7y3-hmfW03jxPvfbkwgb_uR8KOhiNbEsjVP/exec";

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08); osc.frequency.setValueAtTime(783.99, now + 0.16);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(110, now + 0.1); gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'slash') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.25); gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25); osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'cheer') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3); gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
    }

    const questions = [
        { q: "ข้อ 1: การแต่งกายไม่ถูกต้องตามยุคและระเบียบ หากตักเตือนแล้วไม่ยอมเปลี่ยน เจ้าพนักงานสามารถจับกุมได้กี่วินาที?", options: ["60 วินาที", "120 วินาที", "300 วินาที", "600 วินาที"], answer: 1, reason: "กฎเหล็กข้อ 1 ระบุให้ตักเตือนก่อนทุกครั้ง หากไม่ยอมเปลี่ยน จับกุมได้ 120 วินาที" },
        { q: "ข้อ 2: การยิงปืนในพระนครโดยไม่มีผู้เสียชีวิต ให้จับกุมเป็นเวลากี่วินาที?", options: ["120 วินาที", "300 วินาที", "600 วินาที", "1200 วินาที"], answer: 2, reason: "กฎเหล็กข้อ 2 ยิงปืนในพระนครไม่ว่าด้วยเหตุผลใด ถ้าไม่มีคนเสียชีวิต จับ 600 วินาที" },
        { q: "ข้อ 3: การฆ่ากันจนถึงแก่ความตาย ตามกฎเหล็ก ให้จับกุมกี่วินาทีโดยไม่ต้องตักเตือนสอบถาม?", options: ["600 วินาที", "900 วินาที", "1200 - 1800 วินาที", "2400 วินาที"], answer: 2, reason: "กฎเหล็กข้อ 3 ฆ่ากันจนถึงแก่ความตาย ให้จับกุม 1200-1800 วินาที" },
        { q: "ข้อ 4: การจับกุมมากหรือน้อยกว่าที่กำหนดไว้ในกฎหมายและกฎเหล็กนี้ ถือเป็นความผิดหรือไม่?", options: ["ถือเป็นดุลยพินิจของเจ้าพนักงาน", "ถือเป็นความชอบธรรม", "ถือเป็นความผิด", "ไม่มีความผิดหากผู้ร้ายขัดขืน"], answer: 2, reason: "กฎเหล็กข้อ 4 การจับกุมมากหรือน้อยกว่าที่กำหนดไว้ ถือเป็นความผิด" },
        { q: "ข้อ 5: ตามหมวด 3 มาตรา 5 โทษสำหรับขุนนาง โทษทางวินัยสูงสุดคือข้อใด?", options: ["จำคุก 1000 วินาที", "ริบทรัพย์สินทั้งหมด", "ประหารชีวิตสถานเดียว", "ปลดจ่า / ลงบรรดาศักดิ์ / จำคุก / ปรับ"], answer: 3, reason: "มาตรา 5 กำหนดโทษขุนนางคือ ปลดจ่า / ลงบรรดาศักดิ์ / จำคุก / ปรับ" },
        { q: "ข้อ 6: ตามหมวด 4 มาตรา 16 การฆ่าผู้อื่น มีโทษตามกฎหมายอย่างไร?", options: ["จำคุก 600 วินาที", "จำคุก 1050 วิ / ปรับ 5000 พดด้วง", "จำคุก 1500 วินาที", "ประหารชีวิต"], answer: 1, reason: "มาตรา 16 ฆ่าผู้อื่น จำคุก 1050 วิ / ปรับ 5000 พดด้วง" },
        { q: "ข้อ 7: ตามมาตรา 21 การป้องกันตัวเกินกว่าเหตุ มีกำหนดโทษจำคุกกี่วินาที?", options: ["120 วินาที", "350 วินาที", "500 วินาที", "750 วินาที"], answer: 1, reason: "มาตรา 21 การป้องกันตัวเกินกว่าเหตุ จำคุก 350 วิ" },
        { q: "ข้อ 8: ตามมาตรา 24 การขโมยม้าลำปางรอง มีโทษจำคุกกี่วินาที?", options: ["300 วินาที", "500 วินาที", "750 วินาที", "1800 วินาที"], answer: 1, reason: "มาตรา 24 ขโมยม้าลำปางรอง จำคุก 500 วิ" },
        { q: "ข้อ 9: ตามมาตรา 37 การกระทำความผิดตั้งแต่ 5 คนขึ้นไป เรียกว่าอะไร?", options: ["ซ่องโจร (จำคุก 1200 วินาที)", "ขบถพระนคร", "วางเพลิงเผาทรัพย์", "ก่อจลาจล"], answer: 0, reason: "มาตรา 37 การกระทำตั้งแต่ 5 คนขึ้นไป เรียกว่า 'ซ่องโจร' จำคุก 1200 วิ" },
        { q: "ข้อ 10: ตามหมวด 6 มาตรา 53 ปฏิบัติหน้าที่โดยมิชอบ หรือใช้ความรุนแรงตามอำเภอใจ มีโทษอย่างไร?", options: ["ไล่ออกทันที", "หยุดพัก/จำคุก / ทำโทษตามเกณฑ์", "ปรับ 5000 พดด้วง", "ริบทรัพย์สินกึ่งหนึ่ง"], answer: 1, reason: "มาตรา 53 ปฏิบัติหน้าที่โดยมิชอบ มีโทษหยุดพัก/จำคุก/ทำโทษตามเกณฑ์" },
        { q: "ข้อ 11: ตามมาตรา 57 ผู้บริหารชั้นสูงทำผิด มีกระบวนการอย่างไร?", options: ["ปลดออกจากตำแหน่งทันทีโดยไม่ต้องสอบสวน", "สั่งกรรมการสอบสวน + สรุปผลตัดสิน", "จำคุกเป็นเวลา 2 เท่า", "เนรเทศออกจากพระนคร"], answer: 1, reason: "มาตรา 57 ผู้บริหารชั้นสูงทำผิด ให้สั่งกรรมการสอบสวน + สรุปผลตัดสิน" },
        { q: "ข้อ 12: ตามมาตรา 60 ปลอมแปลงเอกสารราชการ มีบทลงโทษตามตารางกฎหมายอย่างไร?", options: ["จำคุก 700 วินาที", "ปลดออกทันที", "ปรับ 1000 พดด้วง", "ประหารชีวิต"], answer: 1, reason: "มาตรา 60 ปลอมแปลงเอกสารราชการ โทษคือปลดออกทันที" },
        { q: "ข้อ 13: ตามมาตรา 61 ผู้ใดปลอมเอกสารของหน่วยงาน (บางส่วนหรือทั้งฉบับ) มีโทษอย่างไร?", options: ["จำคุก 700 วิ / ลงโทษตามเกณฑ์ ฝึกอบรม", "ปรับ 800 พดด้วง", "จำคุก 1050 วินาที", "ริบทรัพย์สินทั้งหมด"], answer: 0, reason: "มาตรา 61 ปลอมเอกสารของหน่วยงาน จำคุก 700 วิ / ลงโทษตามเกณฑ์ ฝึกอบรม" },
        { q: "ข้อ 14: ตามมาตรา 62 ผู้ใดปลอมตราประทับหรือตราประจำหลักที่ทำให้เข้าใจผิด มีโทษปรับเท่าไหร่?", options: ["ปรับ 500 พดด้วง", "ปรับ 800 พดด้วง", "ปรับ 1050 พดด้วง", "ปรับ 5000 พดด้วง"], answer: 1, reason: "มาตรา 62 ปลอมตราประทับ จำคุก 800 วิ และอาสาสมัคร คณะบริหาร สามารถปลดออกจากกรมได้ทันที" },
        { q: "ข้อ 15: ตามมาตรา 63 ผู้ใดแอบใช้ตราทางหลวงโดยไม่ได้รับอนุญาต มีโทษจำคุกกี่วินาที?", options: ["จำคุก 500 วินาที", "จำคุก 800 วินาที", "จำคุก 1050 วินาที", "จำคุก 1800 วินาที"], answer: 2, reason: "มาตรา 63 แอบใช้ตราทางหลวงโดยไม่ได้รับอนุญาต จำคุก 1050 วิ" },
        { q: "ข้อ 16: ตามมาตรา 64 ผู้ใดปลอมเอกสารทางแพ่ง (เช่น สัญญา ทำให้ผู้เสียหายเสียเงิน) มีบทลงโทษอย่างไร?", options: ["จำคุก 500 วิ (คืนเงินเต็มจำนวน พร้อมดอกเบี้ย)", "จำคุก 1050 วินาที", "ปรับ 2500 พดด้วง", "ปลดออกจากตำแหน่งขุนนาง"], answer: 0, reason: "มาตรา 64 ปลอมเอกสารทางแพ่ง จำคุก 500 วิ + คืนเงินเต็มจำนวน พร้อมดอกเบี้ย" },
        { q: "ข้อ 17: ตามมาตรา 65 ผู้ใดใช้เอกสารปลอม (เพื่อแอบอ้างสิทธิหรือกระทำการใดๆ) มีโทษจำคุกกี่วินาที?", options: ["จำคุก 500 วินาที", "จำคุก 700 วินาที", "รับโทษตาม ม.60", "จำคุก 2400 วินาที"], answer: 2, reason: "มาตรา 65 ผู้ใดใช้เอกสารปลอม รับโทษตาม ม.60 (ปลดออกทันที)" },
        { q: "ข้อ 18: ตามหมวด 7 มาตรา 67 ขุนนางกระทำความผิด จะได้รับบทลงโทษอย่างไรเทียบกับราษฎรทั่วไป?", options: ["รับโทษเท่ากัน", "รับโทษเป็น 2 เท่า", "ลดโทษลงกึ่งหนึ่ง", "ได้รับการละเว้นโทษสถานเบา"], answer: 1, reason: "มาตรา 67 ขุนนางกระทำความผิด รับโทษเป็น 2 เท่า" },
        { q: "ข้อ 19: ตามหมวด 4 มาตรา 17 ทำร้ายร่างกายผู้อื่น (ใช้อาวุธ / มีการวางแผน) มีโทษตามตารางคือข้อใด?", options: ["จำคุก 500 วินาที", "จำคุก 1575 วินาที", "ปรับ 5000 พดด้วง", "ประหารชีวิต"], answer: 1, reason: "มาตรา 17 ทำร้ายร่างกายผู้อื่น (ใช้อาวุธ/วางแผน) จำคุก 1575 วิ ตาม ม.16" },
        { q: "ข้อ 20: ตามหมวด 4 มาตรา 22 ความผิดในหมวดนี้ยอมความกันไม่ได้ หากตกลงกันไม่ได้จะมีผลอย่างไร?", options: ["ยกฟ้องคดีทันที", "ให้ปรับเงินสองเท่า", "ตกลงกันไม่ได้ให้ยกฟ้องถือว่าไม่ผิด", "ให้จำคุกผู้เสียหายแทน"], answer: 2, reason: "มาตรา 22 ความผิดในหมวดนี้ยอมความไม่ได้ ถ้าตกลงกันไม่ได้ให้ยกฟ้องถือว่าไม่ผิด" }
    ];

    let playerName = "";
    let playerRank = "";
    let currentQuestionIndex = 0;
    let score = 0;

    const startScreen = document.getElementById('start-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const questionBox = document.getElementById('question-box');
    const optionsGrid = document.getElementById('options-grid');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const feedbackBanner = document.getElementById('feedback-banner');

    const playerFighter = document.getElementById('player-fighter');
    const enemyFighter = document.getElementById('enemy-fighter');

    function loadLocalRankSidebar() {
        const rankList = document.getElementById('rank-list');
        const savedName = localStorage.getItem('nakornban_last_name') || "ยังไม่มีผู้สอบ";
        const savedRankTitle = localStorage.getItem('nakornban_last_rank') || "-";
        const savedScore = localStorage.getItem('nakornban_high_score') || 0;

        rankList.innerHTML = `
            <div class="rank-item top-1">
              <div class="rank-row-top">
                <span>🥇 1. ${savedName}</span>
                <span>${savedScore}/20 คะแนน</span>
              </div>
              <div class="rank-row-sub">ตำแหน่ง: ${savedRankTitle}</div>
            </div>
            <div class="rank-item">
              <div class="rank-row-top">
                <span>🥈 2. ขุนสิทธิ์</span>
                <span>15/20 คะแนน</span>
              </div>
              <div class="rank-row-sub">ตำแหน่ง: จ่าพระนครบาล</div>
            </div>
            <div class="rank-item">
              <div class="rank-row-top">
                <span>🥉 3. หลวงศรียศ</span>
                <span>14/20 คะแนน</span>
              </div>
              <div class="rank-row-sub">ตำแหน่ง: ขุนนาง</div>
            </div>
        `;
    }

    function saveHighScore(newScore, name, rankTitle) {
        const currentHigh = parseInt(localStorage.getItem('nakornban_high_score') || 0);
        if (newScore >= currentHigh) {
            localStorage.setItem('nakornban_high_score', newScore);
            localStorage.setItem('nakornban_last_name', name);
            localStorage.setItem('nakornban_last_rank', rankTitle);
        }
        loadLocalRankSidebar();
    }

    function handleStart() {
        initAudio();
        playSound('click');
        playerName = document.getElementById('player-name').value.trim() || "ไม่ระบุชื่อ";
        playerRank = document.getElementById('player-rank').value.trim() || "ไม่ระบุตำแหน่ง";
        
        document.getElementById('player-info-display').innerText = `${playerName} (${playerRank})`;
        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        
        currentQuestionIndex = 0;
        score = 0;
        updateHeader();
        loadQuestion();
    }

    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(); });
    restartBtn.addEventListener('click', () => {
        playSound('click');
        resultScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
    });

    function updateHeader() {
        progressText.innerText = `ข้อที่: ${String(currentQuestionIndex + 1).padStart(2, '0')}/${questions.length}`;
        scoreText.innerText = `SCORE: ${String(score).padStart(2, '0')}`;
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        questionBox.innerText = q.q;
        optionsGrid.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.onclick = () => selectOption(idx);
            optionsGrid.appendChild(btn);
        });

        updateHeader();
    }

    function selectOption(selectedIndex) {
        const q = questions[currentQuestionIndex];
        const buttons = optionsGrid.children;

        for (let btn of buttons) {
            btn.style.pointerEvents = 'none';
        }

        // Trigger แอนิเมชันต่อสู้ระหว่างตอบ
        playerFighter.classList.add('anim-attack');
        setTimeout(() => enemyFighter.classList.add('anim-hit'), 150);

        setTimeout(() => {
            playerFighter.classList.remove('anim-attack');
            enemyFighter.classList.remove('anim-hit');
        }, 400);

        if (selectedIndex === q.answer) {
            score++;
            buttons[selectedIndex].classList.add('correct');
            playSound('correct');
            showFeedback(true, "ถูกต้อง! " + q.reason);
        } else {
            buttons[selectedIndex].classList.add('wrong');
            buttons[q.answer].classList.add('correct');
            playSound('wrong');
            showFeedback(false, "ผิด! " + q.reason);
        }

        scoreText.innerText = `SCORE: ${String(score).padStart(2, '0')}`;

        setTimeout(() => {
            hideFeedback();
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 2000);
    }

    function showFeedback(isCorrect, text) {
        feedbackBanner.innerText = isCorrect ? "✨ ถูกต้อง!" : "❌ ผิด!";
        feedbackBanner.className = `feedback-banner ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}`;
        feedbackBanner.classList.remove('hidden');
        questionBox.innerText = text;
    }

    function hideFeedback() {
        feedbackBanner.classList.add('hidden');
    }

    function endGame() {
        const passed = score >= 14;
        
        if (passed) {
            playSound('cheer');
            document.getElementById('result-title').innerText = "🎉 ผ่านการทดสอบ! 🎉";
            document.getElementById('result-title').style.color = "#16845b";
            document.getElementById('result-desc').innerText = `ยอดเยี่ยม! คุณ ${playerName} (${playerRank}) ทำได้ผ่านเกณฑ์ 14 ข้อขึ้นไป เหมาะสมแก่การรักษาความสงบ!`;
        } else {
            playSound('slash');
            document.getElementById('result-title').innerText = "⚔️ ไม่ผ่านการทดสอบ! ⚔️";
            document.getElementById('result-title').style.color = "#c74652";
            document.getElementById('result-desc').innerText = `คุณ ${playerName} (${playerRank}) คะแนนไม่ถึงเกณฑ์ 14 ข้อ! กรมพระนครบาลลงโทษ ไปศึกษากฎหมายมาใหม่!`;
        }

        document.getElementById('result-score').innerText = `${score} / ${questions.length} คะแนน`;
        resultScreen.classList.remove('hidden');

        saveHighScore(score, playerName, playerRank);
        sendDataToGoogleSheet(playerName, playerRank, score, passed ? "ผ่านการทดสอบ" : "ไม่ผ่านการทดสอบ");
    }

    function sendDataToGoogleSheet(name, rank, score, status) {
        const statusElem = document.getElementById('save-status');
        if (!GOOGLE_SHEET_WEB_APP_URL) {
            statusElem.innerText = "⚠️ ไม่พบ URL ของ Google Sheets";
            return;
        }

        statusElem.innerText = "⏳ กำลังบันทึกข้อมูลไปยัง Google Sheets...";

        fetch(GOOGLE_SHEET_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, rank: rank, score: score, status: status })
        })
        .then(() => {
            statusElem.innerText = "✅ บันทึกข้อมูลไปยัง Google Sheets เรียบร้อยแล้ว!";
        })
        .catch(() => {
            statusElem.innerText = "❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล";
        });
    }

    loadLocalRankSidebar();
</script>

</body>
</html>
