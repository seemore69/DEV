<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบกฎหมาย กรมพระนครบาล (Cyber Pixel Blue)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&family=Silkscreen:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #030712;
            font-family: 'Sarabun', sans-serif;
            color: #e0f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 92vh;
            max-height: 880px;
            background: linear-gradient(180deg, #0f172a 0%, #030712 100%);
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #0284c7;
            padding: 12px 10px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            color: #7dd3fc;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6), 2px 2px 0px #030712;
            letter-spacing: 0.5px;
        }

        .header-sub {
            font-size: 11px;
            color: #93c5fd;
            margin-top: 2px;
            font-weight: 600;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 16px;
            background: rgba(3, 7, 18, 0.8);
            border-bottom: 2px solid #1e293b;
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            font-family: 'Silkscreen', cursive;
        }

        .stage-view {
            flex: 1;
            position: relative;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pixel-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .content-area {
            background: #0f172a;
            border-top: 4px solid #0284c7;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 350px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.4);
        }

        .question-box {
            background: #030712;
            border: 2px solid #0284c7;
            padding: 12px 14px;
            border-radius: 8px;
            color: #f0f9ff;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            min-height: 72px;
            box-shadow: inset 0 0 8px rgba(2, 132, 199, 0.3), 0 4px 6px rgba(0,0,0,0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .btn-option {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #0284c7;
            color: #e0f2fe;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            font-family: 'Sarabun', sans-serif;
            box-shadow: 0 4px 0 #030712, inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        .btn-option:hover {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            border-color: #38bdf8;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #030712, 0 0 12px rgba(56, 189, 248, 0.5);
        }

        .btn-option:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #030712;
        }

        .btn-option.correct {
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%) !important;
            border-color: #4ade80 !important;
            color: #fff !important;
            box-shadow: 0 4px 0 #052e16, 0 0 15px rgba(74, 222, 128, 0.6) !important;
        }

        .btn-option.wrong {
            background: linear-gradient(180deg, #dc2626 0%, #b91c1c 100%) !important;
            border-color: #f87171 !important;
            color: #fff !important;
            box-shadow: 0 4px 0 #450a0a, 0 0 15px rgba(248, 113, 113, 0.6) !important;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 7, 18, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .btn-start {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            border: 3px solid #7dd3fc;
            color: #fff;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 6px 0 #0c4a6e, 0 0 18px rgba(56, 189, 248, 0.5);
            margin-top: 15px;
            font-family: 'Sarabun', sans-serif;
            transition: all 0.15s ease;
            letter-spacing: 0.5px;
        }

        .btn-start:hover {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0c4a6e, 0 0 25px rgba(56, 189, 248, 0.8);
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0c4a6e;
        }

        .feedback-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 24px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 8px;
            border: 2px solid #fff;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .feedback-correct { background: #16a34a; color: #dcfce7; border-color: #4ade80; }
        .feedback-wrong { background: #dc2626; color: #fee2e2; border-color: #f87171; }

        .badge-icon {
            display: inline-block;
            vertical-align: middle;
            margin: 0 4px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div style="display: flex; justify-content: center; align-items: center; gap: 6px;">
            <!-- Cool Neon Handcuffs & Sword SVG Badge -->
            <svg class="badge-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2">

    <div class="stage-view">
        <svg id="pixel-canvas" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">

                    <rect class="pixel" x="82" y="59" width="3" height="4" fill="#030712"/>
                    <rect class="pixel" x="75" y="59" width="1" height="1" fill="#fff"/>
                    <rect class="pixel" x="82" y="59" width="1" height="1" fill="#fff"/>
                    <!-- Cute Blush -->
                    <rect class="pixel" x="74" y="63" width="2" height="1" fill="#f43f5e"/>
                    <rect class="pixel" x="84" y="63" width="2" height="1" fill="#f43f5e"/>
                    <!-- Body Armor & Shoulder Pads -->
                    <rect class="pixel" x="71" y="66" width="18" height="16" fill="#0f172a"/>

                    <rect class="pixel" x="68" y="67" width="4" height="5" fill="#38bdf8"/>
                    <rect class="pixel" x="88" y="67" width="4" height="5" fill="#38bdf8"/>
                    <!-- Gold/Neon Belt & Dual Swords -->
                    <rect class="pixel" x="70" y="77" width="20" height="3" fill="#f59e0b"/>

                    <!-- Boots -->
                    <rect class="pixel" x="73" y="82" width="5" height="8" fill="#030712"/>

                <!-- Happy Cute Nakornban (Pass >= 14) -->
                <g id="char-happy" class="hidden">
                    <g id="happy-jump">
                        <path class="pixel" d="M72,47 L88,47 L85,37 L75,37 Z" fill="#0284c7"/>
                        <rect class="pixel" x="70" y="47" width="20" height="4" fill="#38bdf8"/>

                        <!-- Happy Joy Eyes ^ ^ -->

                        <!-- Body Raised Arms -->

                        <rect class="pixel" x="82" y="77" width="5" height="6" fill="#030712"/>

                    <!-- Glowing Cyber Confetti & Sparkles -->

                        <circle cx="115" cy="25" r="3" fill="#f43f5e"/>

    <div class="content-area">

        <div id="options-grid" class="options-grid"></div>

    <div id="start-screen" class="screen">
        <div style="background: rgba(15, 23, 42, 0.8); border: 2px solid #0284c7; padding: 15px; border-radius: 12px; margin-bottom: 10px;">
            <h2 style="color: #7dd3fc; margin: 0 0 8px 0; font-size: 20px; font-weight: 800;">📜 กฎหมายพระนครบาล 📜</h2>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'square'; osc.frequency.setValueAtTime(400, now);
            gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08); osc.frequency.setValueAtTime(783.99, now + 0.16);
            gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(110, now + 0.1); gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'slash') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.25); gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25); osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'cheer') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3); gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        }
    }

    // Fixed sequential 20-question bank from documents
    const questions = [
        {
            q: "ข้อ 1: กฎเหล็กข้อ 1 การแต่งกายไม่ถูกต้องตามยุคและระเบียบ หากไม่ยอมเปลี่ยน สามารถจับกุมได้กี่วินาที?",
            options: ["60 วินาที", "120 วินาที", "300 วินาที", "600 วินาที"],
            answer: 1,
            reason: "กฎเหล็กข้อ 1 ระบุให้ตักเตือนก่อนทุกครั้ง หากไม่ยอมเปลี่ยน จับกุมได้ 120 วินาที"
        },
        {
            q: "ข้อ 2: กฎเหล็กข้อ 2 การยิงปืนในพระนครโดยไม่มีผู้เสียชีวิต ให้จับกุมกี่วินาที?",
            options: ["120 วินาที", "300 วินาที", "600 วินาที", "900 วินาที"],
            answer: 2,
            reason: "กฎเหล็กข้อ 2 ยิงปืนในพระนครไม่ว่าด้วยเหตุผลใด ถ้าไม่มีคนเสียชีวิต จับ 600 วินาที"
        },
        {
            q: "ข้อ 3: กฎเหล็กข้อ 2 หากยิงปืนในพระนครและทำผิดซ้ำซาก เพิ่มเวลาจับกุมได้สูงสุดกี่วินาที?",
            options: ["700 วินาที", "800 วินาที", "900 วินาที", "1200 วินาที"],
            answer: 2,
            reason: "หากทำผิดซ้ำซากเพิ่มเวลาจับกุมได้ถึง 900 วินาที"
        },
        {
            q: "ข้อ 4: กฎเหล็กข้อ 3 การฆ่ากันจนถึงแก่ความตาย ให้จับกุมกี่วินาที โดยไม่ต้องตักเตือน?",
            options: ["600 - 900 วินาที", "900 - 1200 วินาที", "1200 - 1800 วินาที", "2400 วินาที"],
            answer: 2,
            reason: "กฎเหล็กข้อ 3 ฆ่ากันจนถึงแก่ความตาย ให้จับกุม 1200-1800 วินาที โดยไม่ต้องตักเตือนสอบถาม"
        },
        {
            q: "ข้อ 5: กฎเหล็กข้อ 4 การจับกุมมากหรือน้อยกว่าที่กำหนดไว้ในกฎหมายถือเป็นอย่างไร?",
            options: ["ทำได้ตามดุลพินิจ", "ถือเป็นความผิด", "ได้รับการยกเว้น", "ตักเตือนเจ้าพนักงาน"],
            answer: 1,
            reason: "กฎเหล็กข้อ 4 การจับกุมมากหรือน้อยกว่าที่กำหนดไว้ ถือเป็นความผิด"
        },
        {

    let currentQuestionIndex = 0;
    let score = 0;

    const startScreen = document.getElementById('start-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const questionBox = document.getElementById('question-box');
    const optionsGrid = document.getElementById('options-grid');
    const progressText = document.getElementById('progress-text');
    const scoreText = document.getElementById('score-text');
    const feedbackBanner = document.getElementById('feedback-banner');

    const charNormal = document.getElementById('char-normal');
    const charHappy = document.getElementById('char-happy');
    const charAngry = document.getElementById('char-angry');

    function handleStart() {
        initAudio();
        playSound('click');
        startGame();
    }

    startBtn.addEventListener('click', handleStart);
    startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(); });
    restartBtn.addEventListener('click', handleStart);
    restartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(); });

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;

        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        
        resetCharState();
        updateHeader();
        loadQuestion();
    }

    function resetCharState() {
        charNormal.classList.remove('hidden');
        charHappy.classList.add('hidden');
        charAngry.classList.add('hidden');
    }

    function updateHeader() {
        progressText.innerText = `ข้อที่: ${currentQuestionIndex + 1}/${questions.length}`;
        scoreText.innerText = `คะแนน: ${score}`;
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        questionBox.innerText = q.q;
        optionsGrid.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.onclick = () => selectOption(idx);
            optionsGrid.appendChild(btn);
        });

        updateHeader();
    }

    function selectOption(selectedIndex) {
        const q = questions[currentQuestionIndex];
        const buttons = optionsGrid.children;

        for (let btn of buttons) {
            btn.style.pointerEvents = 'none';
        }

        if (selectedIndex === q.answer) {
            score++;
            buttons[selectedIndex].classList.add('correct');
            playSound('correct');
            showFeedback(true, "ถูกต้อง! " + q.reason);
        } else {
            buttons[selectedIndex].classList.add('wrong');
            buttons[q.answer].classList.add('correct');
            playSound('wrong');
            showFeedback(false, "ผิด! " + q.reason);
        }

        scoreText.innerText = `คะแนน: ${score}`;

        setTimeout(() => {
            hideFeedback();
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }, 2000);
    }

    function showFeedback(isCorrect, text) {
        feedbackBanner.innerText = isCorrect ? "✨ ถูกต้อง!" : "❌ ผิด!";
        feedbackBanner.className = `feedback-banner ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}`;
        feedbackBanner.classList.remove('hidden');
        questionBox.innerText = text;
    }

    function hideFeedback() {
        feedbackBanner.classList.add('hidden');
    }

    function endGame() {
        // Pass condition: 14 out of 20 (70%)
        const passed = score >= 14;

        charNormal.classList.add('hidden');
        
        if (passed) {
            charHappy.classList.remove('hidden');
            playSound('cheer');
            document.getElementById('result-title').innerText = "🎉 ผ่านการทดสอบ! 🎉";
            document.getElementById('result-title').style.color = "#60a5fa";
            document.getElementById('result-desc').innerText = "ยอดเยี่ยม! ท่านทำได้ผ่านเกณฑ์ (14 ข้อขึ้นไป) มีความเชี่ยวชาญกฎหมายพระนครบาล เหมาะสมแก่การรักษาความสงบ!";
        } else {
            charAngry.classList.remove('hidden');
            playSound('slash');
            document.getElementById('result-title').innerText = "⚔️ ไม่ผ่านการทดสอบ! ⚔️";
            document.getElementById('result-title').style.color = "#f87171";
            document.getElementById('result-desc').innerText = "คะแนนไม่ถึงเกณฑ์ 14 ข้อ! กรมพระนครบาลลงโทษประหาร/ฟันดาบ ไปศึกษากฎหมายมาใหม่!";
        }

        document.getElementById('result-score').innerText = `${score} / ${questions.length} คะแนน`;
        resultScreen.classList.remove('hidden');
    }
</script>
